version: 2

sources:
  - name: pg_raw
    database: pg_source
    schema: raw
    tables:
      - name: customers
        description: "Raw customer registration records from Postgres"
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: orders
        description: "Raw transactions from Postgres"
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ['completed', 'pending', 'cancelled']
