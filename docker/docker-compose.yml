services:
  postgres:
    image: postgres:16-alpine
    container_name: data_launchpad_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      # Persistent storage across sessions and container restart
      - pg_data:/var/lib/postgresql/data
      # Auto exec on first boot
      - ./init:/docker-entrypoint-initdb.d:ro
    # local dev opimization to disable disc sync for faster seeding and writes
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
